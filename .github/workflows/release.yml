name: Auto-release and Moodle installable ZIP

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to package (defaults to latest)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from commit message
        id: ver
        if: github.event_name == 'push'
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$RELEASE_MESSAGE" | grep -Eq '^V [0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION=$(printf '%s' "$RELEASE_MESSAGE" | sed -nE 's/^V ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Create annotated tag for a version commit
        if: steps.ver.outputs.version != ''
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Select release to package
        id: release
        env:
          COMMIT_VERSION: ${{ steps.ver.outputs.version }}
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$COMMIT_VERSION" ]]; then
            TAG="$COMMIT_VERSION"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            TAG="$REQUESTED_TAG"
          else
            # A normal push repairs a missing ZIP on the latest published release.
            TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          fi

          if [[ -z "$TAG" ]]; then
            echo "No published release yet; nothing to package."
            exit 0
          fi
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "::error::Tag $TAG does not exist in the repository."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and verify the Moodle plugin ZIP
        id: package
        if: steps.release.outputs.tag != ''
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ZIP="local_plainlanguage_${TAG}.zip"

          # GitHub's autogenerated Source code ZIP has the wrong root folder.
          # Moodle requires the component's directory name (without "local_").
          git archive --format=zip --prefix=plainlanguage/ --output="$ZIP" "$TAG"
          unzip -tq "$ZIP"
          unzip -Z -1 "$ZIP" > "$RUNNER_TEMP/plainlanguage-archive-files.txt"

          if grep -Ev '^plainlanguage/' "$RUNNER_TEMP/plainlanguage-archive-files.txt"; then
            echo "::error::The ZIP contains entries outside plainlanguage/."
            exit 1
          fi
          for required in version.php index.php lib.php; do
            if ! grep -Fxq "plainlanguage/$required" "$RUNNER_TEMP/plainlanguage-archive-files.txt"; then
              echo "::error::The ZIP is missing plainlanguage/$required."
              exit 1
            fi
          done

          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Create release and attach installable ZIP
        if: steps.ver.outputs.version != '' && steps.package.outputs.file != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          files: ${{ steps.package.outputs.file }}
          fail_on_unmatched_files: true
          body: |
            Release ${{ steps.release.outputs.tag }} automatically generated by the commit:
            ${{ github.event.head_commit.id }}

            Install Moodle using the attached local_plainlanguage ZIP asset, not GitHub's Source code ZIP.
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Attach a missing ZIP to an existing release
        if: steps.ver.outputs.version == '' && steps.package.outputs.file != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          ZIP: ${{ steps.package.outputs.file }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [[ "$MANUAL" == 'true' ]]; then
            # Explicit manual runs can replace a broken asset of the same name.
            gh release upload "$TAG" "$ZIP" --clobber
          elif gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$ZIP"; then
            echo "Release $TAG already includes $ZIP."
          else
            gh release upload "$TAG" "$ZIP"
          fi
